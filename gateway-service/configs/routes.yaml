# 转发规则(颗粒度是业务，非服务)
routes:
# 规则1，转发到登录相关接口
  - id: auth-public
    prefix: /api/v1/auth
    target: user-service
    stripPrefix: false
    middlewares: [cors, requestid]

# 规则2，转发到用户相关接口
  - id: users-secure
    prefix: /api/v1/users
    target: user-service
    stripPrefix: false
    middlewares: [cors, requestid, auth]
