# LeadReach AI 服务编排（服务器 172.21.160.247 部署用）
# 说明（方案 A）：
#   - 前端不在此编排：由服务器现有 nginx 容器托管，剔除此处
#   - 网关映射 8082：宿主机 8080 已被 jenkins 容器占用
#   - Redis/MySQL/Nacos 已在宿主机运行，容器内用宿主 IP 访问
# 启动：docker compose -f docker-compose.yml up -d --build
services:
  # ── 网关：Go 服务（APP_ENV=production 加载 config.prod.yaml）──
  gateway:
    image: leadreach/gateway:latest
    build: ./gateway-service
    container_name: leadreach-gateway
    environment:
      - APP_ENV=production
    ports:
      - "8082:8080"
    depends_on:
      - user-service
      - crm-service
    networks:
      - leadreach-net
    restart: unless-stopped

  # ── 后端：Java 服务（SPRING_PROFILES_ACTIVE=prod 加载 application-prod.yml）──
  user-service:
    image: leadreach/user-service:latest
    build: ./service
    container_name: leadreach-user-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8081:8081"
    networks:
      - leadreach-net
    restart: unless-stopped

  # ── 线索模块：crm-service（构建上下文是 service/，Dockerfile 在子模块目录）──
  crm-service:
    image: leadreach/crm-service:latest
    build:
      context: ./service
      dockerfile: crm-service/Dockerfile
    container_name: leadreach-crm-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8083:8083"
    depends_on:
      - user-service
    networks:
      - leadreach-net
    restart: unless-stopped

networks:
  leadreach-net:
    driver: bridge