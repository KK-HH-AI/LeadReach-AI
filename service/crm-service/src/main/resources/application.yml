# 公共配置（所有环境共用）
server:
  port: 8083

spring:
  application:
    name: crm-service
  # 默认本地环境；服务器上通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: local
  flyway:
    # crm_db 是本模块专属的全新库，不存在存量表，无需 baseline
    enabled: true

# Nacos / MySQL 按环境区分，见 application-local.yml / application-prod.yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 线索保护期与回收策略
crm:
  lead:
    # 领取/分配后默认保护天数，超过则被定时任务退回公海
    protect-days: 15
    # 退回公海扫描任务的 cron：每天凌晨 3 点
    recycle-cron: "0 0 3 * * ?"
    # 看板「即将超保护期」的预警窗口（天）
    expiring-soon-days: 3